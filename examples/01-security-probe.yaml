# Scenario 1: security probing
# Docs: https://github.com/guanting112/httpdog/blob/main/docs/rules.md#using-the-rule-templates

notifiers:
  console:
    type: stderr
  ops:
    type: webhook
    url_env: HTTPDOG_WEBHOOK_URL
    secret_env: HTTPDOG_WEBHOOK_SECRET

rules:
  # A sensitive file was served, not just asked for. Matches uri on purpose
  - id: sensitive-file-exposed
    when:
      all:
        - any:
            - { field: uri, op: suffix, value: /.env }
            - { field: uri, op: prefix, value: /.git/ }
            - { field: uri, op: prefix, value: /.aws/ }
            - { field: uri, op: prefix, value: /.ssh/ }
            - { field: uri, op: regex, value: '\.(sql|bak|old|swp|tar\.gz|zip)$' }
        - { field: status, op: in, value: [200, 206] }
    group_by: uri
    cooldown: 1h
    notify: [console, ops]
    message: "Sensitive file read: {host}{uri} (status {status}, {body_bytes_sent} bytes, from {remote_addr})"

  - id: sensitive-file-probe
    when:
      any:
        - { field: request_path, op: suffix, value: /.env }
        - { field: request_path, op: prefix, value: /.git/ }
        - { field: request_path, op: prefix, value: /.aws/ }
        - { field: request_path, op: prefix, value: /.ssh/ }
        - { field: request_path, op: regex, value: '\.(sql|bak|old|swp|tar\.gz|zip)$' }
    group_by: remote_addr
    cooldown: 10m
    notify: [console]
    message: "{remote_addr} tried to access {request_path} (status {status})"

  - id: path-traversal
    when:
      field: request_uri
      op: regex
      value: '(?i)(\.\./|\.\.%2f|%2e%2e(/|%2f)|/etc/passwd)'
    group_by: remote_addr
    cooldown: 10m
    notify: [console]
    message: "{remote_addr} possible directory traversal: {request_uri} (status {status})"

  - id: sqli-probe
    when:
      field: request_uri
      op: regex
      value: '(?i)(union(\+|%20)+(all(\+|%20)+)?select|information_schema|sleep\(\d+\)|benchmark\()'
    group_by: remote_addr
    cooldown: 10m
    notify: [console]
    message: "{remote_addr} possible SQL injection: {request_uri} (status {status})"

  - id: scanner-user-agent
    when:
      field: http_user_agent
      op: regex
      value: '(?i)(sqlmap|nikto|nmap|masscan|zgrab|nuclei|wpscan|dirbuster|gobuster|acunetix)'
    group_by: remote_addr
    cooldown: 1h
    notify: [console]
    message: "{remote_addr} is using a scanning tool: {http_user_agent}"

  - id: not-found-scan
    when: { field: status, op: eq, value: 404 }
    group_by: remote_addr
    threshold: { count: 30, window: 60s }
    cooldown: 10m
    notify: [console]
    message: "{remote_addr} many 404s, latest: {request_path}"
