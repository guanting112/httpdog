# Scenario 4: traffic anomalies. Set the thresholds against your normal traffic.
# Docs: https://github.com/guanting112/httpdog/blob/main/docs/rules.md#using-the-rule-templates

notifiers:
  console:
    type: stderr
  ops:
    type: webhook
    url_env: HTTPDOG_WEBHOOK_URL
    secret_env: HTTPDOG_WEBHOOK_SECRET

overload:
  notify: [console, ops]
  cooldown: 5m

rules:
  # exists on remote_addr matches every line
  - id: traffic-surge
    when: { field: remote_addr, op: exists }
    threshold: { count: 5000, window: 10s }
    cooldown: 5m
    notify: [ops]
    message: "Site-wide traffic surge, latest: {host}{request_path}"

  - id: single-ip-flood
    when: { field: remote_addr, op: exists }
    group_by: remote_addr
    threshold: { count: 300, window: 10s }
    cooldown: 10m
    notify: [ops]
    message: "{remote_addr} abnormal request volume, latest: {request_path}"

  - id: hot-endpoint
    when: { field: request_path, op: exists }
    group_by: request_path
    threshold: { count: 2000, window: 10s }
    cooldown: 10m
    notify: [console]
    message: "{host}{request_path} is being hammered"

  # Use your own resource-hungry paths
  - id: expensive-endpoint-abuse
    when:
      any:
        - { field: request_path, op: prefix, value: /search }
        - { field: request_path, op: prefix, value: /api/export }
    group_by: remote_addr
    threshold: { count: 30, window: 60s }
    cooldown: 10m
    notify: [console, ops]
    message: "{remote_addr} is calling {request_path} heavily"

  - id: scripted-client-flood
    when:
      field: http_user_agent
      op: regex
      value: '(?i)(python-requests|curl/|wget/|go-http-client|scrapy|okhttp|java/)'
    group_by: remote_addr
    threshold: { count: 100, window: 60s }
    cooldown: 30m
    notify: [console]
    message: "{remote_addr} many scripted requests: {http_user_agent}"

  - id: empty-user-agent
    when: { field: http_user_agent, op: in, value: ["", "-"] }
    group_by: remote_addr
    threshold: { count: 50, window: 60s }
    cooldown: 30m
    notify: [console]
    message: "{remote_addr} many requests with no User-Agent, latest: {request_path}"

  # A single response over 100 MB
  - id: large-response
    when: { field: body_bytes_sent, op: gt, value: 104857600 }
    group_by: remote_addr
    cooldown: 10m
    notify: [console]
    message: "{remote_addr} downloaded {body_bytes_sent} bytes: {request_path}"
