# Scenario 3: site health. Set the thresholds against your normal traffic.
# Docs: https://github.com/guanting112/httpdog/blob/main/docs/rules.md#using-the-rule-templates

notifiers:
  console:
    type: stderr
  ops:
    type: webhook
    url_env: HTTPDOG_WEBHOOK_URL
    secret_env: HTTPDOG_WEBHOOK_SECRET

rules:
  - id: upstream-5xx-burst
    when: { field: status, op: gte, value: 500 }
    threshold: { count: 50, window: 1m }
    cooldown: 5m
    notify: [ops]
    message: "5xx surge, latest: {request_method} {host}{request_path} -> {status}"

  - id: gateway-errors
    when: { field: status, op: in, value: [502, 503, 504] }
    threshold: { count: 10, window: 30s }
    cooldown: 5m
    notify: [ops]
    message: "Backend not responding, latest: {request_method} {host}{request_path} -> {status}"

  # Which site is failing, when several share one nginx
  - id: host-5xx
    when: { field: status, op: gte, value: 500 }
    group_by: host
    threshold: { count: 20, window: 1m }
    cooldown: 10m
    notify: [console]
    message: "High 5xx rate on {host}, latest: {request_path} -> {status}"

  # /export/ is slow by design
  - id: slow-request
    when:
      all:
        - { field: request_time, op: gt, value: 5 }
        - not: { field: request_path, op: prefix, value: /export/ }
    cooldown: 5m
    notify: [console]
    message: "{request_path} took {request_time}s"

  - id: slow-burst
    when: { field: request_time, op: gt, value: 2 }
    threshold: { count: 30, window: 1m }
    cooldown: 10m
    notify: [ops]
    message: "Responses are slow across the board, latest: {request_path} took {request_time}s"

  - id: healthcheck-failing
    when:
      all:
        - { field: request_path, op: eq, value: /healthz }
        - { field: status, op: ne, value: 200 }
    cooldown: 5m
    notify: [ops]
    message: "Health check failed: {host}{request_path} -> {status}"

  # 499: the client gave up waiting (nginx only)
  - id: client-abort-burst
    when: { field: status, op: eq, value: 499 }
    threshold: { count: 30, window: 1m }
    cooldown: 10m
    notify: [console]
    message: "Many clients disconnected early (499), latest: {request_path} after waiting {request_time}s"
