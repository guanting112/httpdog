# Scenario 5: business-critical paths. Replace the paths and the IP allow list with your site's.
# Docs: https://github.com/guanting112/httpdog/blob/main/docs/rules.md#using-the-rule-templates

notifiers:
  console:
    type: stderr
  ops:
    type: webhook
    url_env: HTTPDOG_WEBHOOK_URL
    secret_env: HTTPDOG_WEBHOOK_SECRET

rules:
  - id: checkout-errors
    when:
      all:
        - any:
            - { field: request_path, op: prefix, value: /checkout }
            - { field: request_path, op: prefix, value: /api/orders }
        - { field: status, op: gte, value: 500 }
    threshold: { count: 3, window: 1m }
    cooldown: 5m
    notify: [console, ops]
    message: "Checkout is failing, latest: {request_method} {request_path} -> {status}"

  - id: payment-callback-failed
    when:
      all:
        - { field: request_path, op: prefix, value: /payment/callback }
        - { field: status, op: gte, value: 400 }
    cooldown: 5m
    notify: [console, ops]
    message: "Payment callback failed: {request_method} {request_path} -> {status} (from {remote_addr})"

  - id: payment-callback-slow
    when:
      all:
        - { field: request_path, op: prefix, value: /payment/callback }
        - { field: request_time, op: gt, value: 3 }
    cooldown: 5m
    notify: [console]
    message: "Payment callback is slow: {request_path} took {request_time}s"

  # The not: block is the allow list: your office / VPN addresses
  - id: admin-unknown-source
    when:
      all:
        - { field: request_path, op: prefix, value: /admin }
        - { field: status, op: lt, value: 400 }
        - not:
            any:
              - { field: remote_addr, op: prefix, value: "10." }
              - { field: remote_addr, op: in, value: [203.0.113.10, 203.0.113.11] }
    group_by: remote_addr
    cooldown: 1h
    notify: [console, ops]
    message: "Unknown source {remote_addr} entered the admin area: {request_method} {request_path} -> {status}"

  # cooldown 0s: every delete is recorded
  - id: admin-destructive-action
    when:
      all:
        - { field: request_method, op: eq, value: DELETE }
        - any:
            - { field: request_path, op: prefix, value: /admin/ }
            - { field: request_path, op: prefix, value: /api/admin/ }
    cooldown: 0s
    notify: [console]
    message: "{remote_addr} performed a delete: {request_path} -> {status}"

  - id: api-client-errors-spike
    when:
      all:
        - { field: request_path, op: prefix, value: /api/ }
        - { field: status, op: in, value: [400, 404, 422] }
    threshold: { count: 100, window: 1m }
    cooldown: 15m
    notify: [ops]
    message: "API client errors surging, latest: {request_method} {request_path} -> {status}"
