# Scenario 2: login and account abuse. Replace the paths with your site's.
# Docs: https://github.com/guanting112/httpdog/blob/main/docs/rules.md#using-the-rule-templates

notifiers:
  console:
    type: stderr
  ops:
    type: webhook
    url_env: HTTPDOG_WEBHOOK_URL
    secret_env: HTTPDOG_WEBHOOK_SECRET

rules:
  - id: login-bruteforce
    when:
      all:
        - { field: request_path, op: prefix, value: /login }
        - { field: request_method, op: eq, value: POST }
        - { field: status, op: in, value: [401, 403] }
    group_by: remote_addr
    threshold: { count: 20, window: 60s }
    cooldown: 10m
    notify: [console, ops]
    message: "{remote_addr} repeated login failures"

  # Many IPs, a few tries each: counted site-wide
  - id: credential-stuffing
    when:
      all:
        - { field: request_path, op: prefix, value: /login }
        - { field: request_method, op: eq, value: POST }
        - { field: status, op: in, value: [401, 403] }
    threshold: { count: 200, window: 5m }
    cooldown: 15m
    notify: [ops]
    message: "Abnormal site-wide login failures, latest from {remote_addr}"

  - id: password-reset-abuse
    when:
      all:
        - { field: request_path, op: prefix, value: /password/reset }
        - { field: request_method, op: eq, value: POST }
    group_by: remote_addr
    threshold: { count: 5, window: 10m }
    cooldown: 30m
    notify: [console, ops]
    message: "{remote_addr} many password reset requests"

  - id: signup-burst
    when:
      all:
        - { field: request_path, op: prefix, value: /signup }
        - { field: request_method, op: eq, value: POST }
    group_by: remote_addr
    threshold: { count: 10, window: 10m }
    cooldown: 30m
    notify: [console]
    message: "{remote_addr} many sign-ups"

  - id: api-unauthorized
    when:
      all:
        - { field: request_path, op: prefix, value: /api/ }
        - { field: status, op: in, value: [401, 403] }
    group_by: remote_addr
    threshold: { count: 50, window: 60s }
    cooldown: 10m
    notify: [console]
    message: "{remote_addr} many API auth failures, latest: {request_method} {request_path} -> {status}"

  - id: rate-limited
    when: { field: status, op: eq, value: 429 }
    group_by: remote_addr
    threshold: { count: 100, window: 60s }
    cooldown: 10m
    notify: [console]
    message: "{remote_addr} keeps getting rate limited, latest: {request_path}"
