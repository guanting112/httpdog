# Goes inside the http { } block. The key names are the names used by field: in the rule file; add fields right here.
# escape=json takes care of quotes and control characters, so a malicious URL cannot break the JSON.
# Keep request_uri: httpdog takes request_path, the field the example rules match paths with, from it.
log_format httpdog escape=json
    '{"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"request_method":"$request_method",'
    '"uri":"$uri",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"}';

# An existing access_log that writes to a file can stay; several access_log lines may sit at the same level
access_log syslog:server=unix:/run/httpdog/httpdog.sock,tag=nginx,nohostname httpdog;
