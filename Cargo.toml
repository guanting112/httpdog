[package]
name = "httpdog"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "Watches nginx / Apache access logs and sends alerts based on a rule file"

[dependencies]
regex = "1"
# Takes the socket systemd holds for httpdog (deploy/httpdog.socket). Turning an inherited file descriptor
# into a socket is unsafe in Rust and this crate forbids unsafe code, so that one step lives in this crate:
# 142 lines, no dependencies of its own
sd-listen-fds = "0.2"
# HMAC-SHA256 for webhook signatures. ureq's TLS (rustls) already pulls in ring,
# so this only refers to the same copy directly and adds no new crate
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
signal-hook = "0.4"
# Default features such as cookies and gzip are off; only TLS and JSON are kept
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# A panic in any thread ends the whole process and leaves the restart to systemd,
# which avoids the silent failure where the notifier thread is dead but the main program lives on
panic = "abort"
