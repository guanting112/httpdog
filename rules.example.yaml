# httpdog rule file. Every key: https://github.com/guanting112/httpdog/blob/main/docs/rules.md
# Check: sudo httpdog -t    Apply: sudo systemctl reload httpdog

listen: unix:/run/httpdog/httpdog.sock
format: json
instance: web-01

notifiers:
  console:
    type: stderr
  ops:
    type: webhook
    url_env: HTTPDOG_WEBHOOK_URL
    secret_env: HTTPDOG_WEBHOOK_SECRET

overload:
  notify: [ops]
  cooldown: 5m

rules:
  - id: sensitive-file-probe
    when:
      any:
        - { field: request_path, op: suffix, value: /.env }
        - { field: request_path, op: prefix, value: /.git/ }
        - { field: request_path, op: regex, value: '\.(sql|bak|tar\.gz)$' }
    group_by: remote_addr
    cooldown: 10m
    notify: [console, ops]
    message: "{remote_addr} tried to access {request_path} (status {status})"

  - id: login-bruteforce
    when:
      all:
        - { field: request_path, op: prefix, value: /login }
        - { field: request_method, op: eq, value: POST }
        - { field: status, op: in, value: [401, 403] }
    group_by: remote_addr
    threshold: { count: 20, window: 60s }
    cooldown: 10m
    notify: [console, ops]
    message: "{remote_addr} repeated login failures"

  - id: upstream-5xx-burst
    when: { field: status, op: gte, value: 500 }
    threshold: { count: 50, window: 1m }
    cooldown: 5m
    notify: [ops]
    message: "5xx surge, latest: {request_method} {request_path} -> {status}"

  # /export/ is slow by design
  - id: slow-request
    when:
      all:
        - { field: request_time, op: gt, value: 5 }
        - not: { field: request_path, op: prefix, value: /export/ }
    cooldown: 5m
    notify: [console, ops]
    message: "{request_path} took {request_time}s"
